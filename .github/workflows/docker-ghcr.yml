name: Publish Docker image to GHCR

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r requirements-dev.txt
    - run: python -m pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # dev branch -> :dev (+ :dev-<sha> for traceability)
    # master branch -> :stable, :latest (+ :<sha>)
    # Image names must be lowercase: adl101010/LiviLogs -> ghcr.io/adl101010/livilogs
    - name: Compute image tags
      id: tags
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        if [ "${{ github.ref_name }}" = "master" ]; then
          {
            echo "tags<<EOF"
            echo "$image:stable"
            echo "$image:latest"
            echo "$image:${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "tags<<EOF"
            echo "$image:dev"
            echo "$image:dev-${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=docker-ghcr
        cache-to: type=gha,mode=max,scope=docker-ghcr
